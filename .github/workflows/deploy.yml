name: Deploy Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: silentricenation
  REGION: asia-east1
  SERVICE: finsheet
  REPO: finsheet

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "$IMAGE"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="finsheet-reader@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="^|^NODE_ENV=production|ALLOWED_EMAILS=ken.kp.chan@gmail.com,ckpopak@gmail.com|YEARLY_SPREADSHEET_ID=1dLumPx3m2dEZjmkG0GA2IUc9vcpnoN5-Rx82abHyemc|CASHFLOW_SPREADSHEET_ID=1Ub9LDhs1rcm-NTdeIYyCCRgK8oEQ5bSTKGW5Mrs5_vA|YEARLY_TAB=OY(hkd)|CASHFLOW_TAB=_cflow" \
            --update-secrets="^|^AUTH_SECRET=finsheet-auth-secret:latest|NEXTAUTH_SECRET=finsheet-auth-secret:latest|GOOGLE_CLIENT_ID=finsheet-google-client-id:latest|GOOGLE_CLIENT_SECRET=finsheet-google-client-secret:latest|NEXTAUTH_URL=finsheet-nextauth-url:latest"
