name: Deploy studio-hub to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Secrets cannot be used in job if: conditions. Opt in with a repo variable
    # (Settings → Secrets and variables → Actions → Variables):
    #   ENABLE_CLOUDRUN_DEPLOY = true
    # Also requires GCP_SA_KEY secret (service account JSON).
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUDRUN_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy studio-hub \
            --source . \
            --region=asia-east1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --project=silentricenation \
            --quiet
