name: Deploy studio-hub to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.GCP_SA_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy studio-hub \
            --source . \
            --region=asia-east1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --project=silentricenation \
            --quiet

  skip:
    if: ${{ secrets.GCP_SA_KEY == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cloud Run deploy skipped
        run: |
          echo "GCP_SA_KEY is not configured — skipping Cloud Run deploy."
          echo "Enable GitHub Pages (.github/workflows/deploy-pages.yml) or add GCP_SA_KEY to deploy."
