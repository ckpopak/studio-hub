<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atmosphere — Cafe QuietLY 靜</title>
    <meta
      name="description"
      content="QuietLY self-playing atmosphere: imagery, song, and lyrics unfold together."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+TC:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/quietly.css" />
    <link rel="stylesheet" href="css/atmosphere.css" />
  </head>
  <body class="atm-body">
    <div class="stage" id="stage" aria-live="polite">
      <div class="stage__visuals" id="visuals" aria-hidden="true"></div>
      <div class="stage__veil"></div>
      <div class="stage__grain" aria-hidden="true"></div>
    </div>

    <header class="atm-chrome">
      <a class="site-nav__brand" href="index.html">靜</a>
      <div class="atm-chrome__center">
        <span class="serif" id="world-title">Cafe QuietLY</span>
        <span id="world-sub">Atmosphere</span>
      </div>
      <div class="atm-chrome__right">
        <label class="atm-select-wrap">
          <span class="sr-only">Episode</span>
          <select id="episode-select" aria-label="Choose episode"></select>
        </label>
        <a href="index.html">Atlas</a>
      </div>
    </header>

    <main class="atm-copy">
      <p class="atm-kicker" id="track-kicker">Ep —</p>
      <h1 class="atm-track serif" id="track-title">—</h1>
      <p class="atm-track-zh zh" id="track-zh">—</p>
      <p class="atm-scene serif" id="scene-line">—</p>
      <p class="atm-scene-zh zh" id="scene-zh">—</p>
      <div class="atm-lyrics zh" id="lyrics-line"></div>
    </main>

    <div class="atm-player" id="player-shell" aria-hidden="true">
      <div id="yt-player"></div>
    </div>

    <footer class="atm-footer">
      <div class="atm-progress" aria-hidden="true">
        <div class="atm-progress__bar" id="progress-bar"></div>
      </div>
      <div class="atm-footer__row">
        <button type="button" class="atm-btn" id="btn-prev" hidden>Prev</button>
        <button type="button" class="atm-btn" id="btn-toggle">Pause</button>
        <button type="button" class="atm-btn" id="btn-next" hidden>Next world</button>
        <span class="atm-time" id="time-label">0:00</span>
      </div>
    </footer>

    <div class="atm-gate" id="gate">
      <div class="atm-gate__card">
        <span class="atm-gate__mark">靜</span>
        <h2 class="serif">Let the room play itself</h2>
        <p>
          Imagery, song, and sparse lyrics move together. One gesture starts the
          atmosphere; after that, it keeps unfolding.
        </p>
        <button type="button" class="atm-gate__btn" id="btn-begin">
          Begin
        </button>
      </div>
    </div>

    <script src="js/atmosphere.js"></script>
  </body>
</html>
