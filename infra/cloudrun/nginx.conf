server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Shelved products — not part of the QuietLY public site.
  location ^~ /channels/siam/ {
    return 404;
  }

  location ^~ /resonance/ {
    return 404;
  }

  # Episode / song JSON must revalidate — otherwise browsers keep empty lyrics
  # or an old episodes-index without EP16+ for up to an hour.
  location ~* /data/.*\.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
    etag on;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(css|js)$ {
    try_files $uri =404;
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
  }

  location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public";
  }
}
