steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-east1-docker.pkg.dev/$PROJECT_ID/finsheet/finsheet:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/finsheet/finsheet:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - finsheet
      - --image=asia-east1-docker.pkg.dev/$PROJECT_ID/finsheet/finsheet:$SHORT_SHA
      - --region=asia-east1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/finsheet/finsheet:$SHORT_SHA
